<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>People</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<meta name="theme-color" content="#f6f4ef">
<style>
:root{--bg:#f6f4ef;--card:#fffdf8;--ink:#1f2a24;--mute:#6f776f;--line:#e4dfd2;--accent:#b9741a;--green:#2f6b55;--chip:#ece7da;--warn:#a5482f;--r:16px}
@media (prefers-color-scheme:dark){:root{--bg:#141815;--card:#1c221e;--ink:#ece8dc;--mute:#98a097;--line:#2c342e;--accent:#e8a23d;--green:#7fb39a;--chip:#262d28;--warn:#e08a6f}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
h1,h2,.serif{font-family:ui-serif,Georgia,"Times New Roman",serif;font-weight:600;letter-spacing:-.01em}
main{max-width:640px;margin:0 auto;padding:18px 16px 150px}
h1{font-size:30px;margin:6px 0 14px}h2{font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);font-family:inherit;margin:22px 0 8px}
input,select,textarea,button{font:inherit;color:inherit}
.field{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);outline:none}
.field:focus{border-color:var(--green)}textarea.field{min-height:84px;resize:vertical}
.btn{border:0;border-radius:999px;padding:11px 18px;background:var(--ink);color:var(--bg);font-weight:600;cursor:pointer}
.btn.ghost{background:var(--chip);color:var(--ink)}.btn.small{padding:7px 12px;font-size:14px}.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;align-items:center}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;text-decoration:none;color:inherit}
.item:last-child{border-bottom:0}.item .sub{color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;color:#fff}
.av.big{width:72px;height:72px;font-size:24px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--chip);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--ink);color:var(--bg)}
.mute{color:var(--mute)}.small{font-size:13px}.warn{color:var(--warn)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav a{flex:1;max-width:160px;text-align:center;padding:10px 0 9px;text-decoration:none;color:var(--mute);font-size:12px}
nav a.on{color:var(--ink);font-weight:700}nav a span{display:block;font-size:20px;line-height:1.1}
.kv{display:grid;grid-template-columns:110px 1fr;gap:8px 10px;padding:14px;align-items:center}.kv label{color:var(--mute);font-size:13px}
.md{padding:4px 14px 12px}.md h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:14px 0 4px}
.md ul{margin:0;padding-left:18px}.md li{margin:3px 0;overflow-wrap:anywhere}.md a{color:var(--green);font-weight:600;text-decoration:none}
.toast{position:fixed;left:50%;bottom:calc(128px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;max-width:90vw;z-index:9}
.status{font-size:13px;color:var(--mute)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mute);margin-right:6px}.dot.ok{background:var(--green)}.dot.pend{background:var(--accent)}
.mic.on{background:var(--warn);color:#fff}
a.act{display:inline-flex;gap:6px;align-items:center;text-decoration:none;background:var(--chip);color:var(--ink);border-radius:999px;padding:8px 13px;font-size:14px;font-weight:600}
.cdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0}
.webbox{position:relative;margin-top:6px}#websvg,#egosvg{display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.we{stroke:#b9b2a2}.we.rel{stroke:#8a7a5c}.we.em{stroke-dasharray:2 2}.wi{stroke:var(--line);stroke-width:.9}
.wn{cursor:pointer}circle.wn{stroke:var(--card);stroke-width:.8}
.wl{text-anchor:middle;font-size:10.5px;font-weight:600;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:3px;pointer-events:none}
.wini{text-anchor:middle;font-size:10px;font-weight:700;fill:#fff;pointer-events:none}
.wlegend{position:absolute;left:6px;bottom:6px;font-size:11px;color:var(--mute);background:var(--card);opacity:.92;border:1px solid var(--line);border-radius:10px;padding:6px 9px;pointer-events:none}
.wlegend b{display:inline-block;width:18px;border-top:2px solid #8a7a5c;vertical-align:middle;margin-right:5px}.wlegend b.t{border-top:1px solid #b9b2a2}.wlegend b.e{border-top:1px dashed #b9b2a2}
.pills{display:flex;flex-wrap:wrap;gap:6px}.pill{display:inline-flex;gap:6px;align-items:center;background:var(--chip);border-radius:999px;padding:5px 11px;font-size:14px;color:var(--ink);text-decoration:none}
.pill .cdot{margin:0}.pill .small{font-size:11px}
.qbar{position:fixed;left:0;right:0;bottom:calc(57px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:10px;padding:8px 16px;pointer-events:none;z-index:5}
.qbar button{pointer-events:auto;flex:1;max-width:220px;border:0;border-radius:999px;padding:12px 10px;font-weight:700;font-size:15px;box-shadow:0 4px 14px rgba(0,0,0,.18);cursor:pointer}
.qbar .q1{background:var(--card);color:var(--ink);border:1px solid var(--line)}.qbar .q2{background:var(--ink);color:var(--bg)}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:10;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet .in{max-width:640px;margin:0 auto;padding:14px 16px 40px}.sheet .x{border:0;background:var(--chip);border-radius:999px;width:38px;height:38px;font-size:18px;cursor:pointer}
.pick{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 14px;cursor:pointer}.pick:last-child{border-bottom:0}
</style>
</head>
<body>
<main id="view"></main>
<div class="qbar" id="qbar"><button class="q1" id="qsearch">🔍 Search</button><button class="q2" id="qadd">＋ Update</button></div>
<nav id="nav"></nav>
<div class="sheet" id="sheet" hidden></div>
<script>
'use strict';
/* ---------- storage ---------- */
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const VAULT_ID='1-4FmyGsKAfs1rh28Vuybo2kIlldudIiN';   // "Emmett" Obsidian vault folder in Google Drive
let S=LS.get('people.settings',{clientId:'',folderId:''});if(!S.clientId)S.clientId='370832423650-o9ukg9jdbc42ck0kr7msfjpq73jgd6qr.apps.googleusercontent.com';
let people=LS.get('people.cache',[]);   // {id,file,name,md,mtime,ops:[]}
let token=null,tokenExp=0,syncing=false,lastSync=LS.get('people.lastSync','');
const save=()=>LS.set('people.cache',people);
let inbox=LS.get('people.inbox',[]);const saveInbox=()=>LS.set('people.inbox',inbox);   // voice notes waiting to go to the vault
const today=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){document.querySelectorAll('.toast').forEach(e=>e.remove());const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),3200)}

/* ---------- markdown notes ---------- */
function parseVal(v){v=v.trim();if(v==='')return'';if(v[0]==='"'){try{return JSON.parse(v)}catch(e){return v.slice(1,-1)}}
  if(v[0]==="'")return v.slice(1,-1);
  if(v[0]==='['){try{return JSON.parse(v)}catch(e){return v.slice(1,-1).split(',').map(x=>x.trim().replace(/^["']|["']$/g,'')).filter(Boolean)}}return v}
function parseNote(md){const fm={};let body=md;const m=md.match(/^---\n([\s\S]*?)\n---\n?/);
  if(m){body=md.slice(m[0].length);let key=null;for(const line of m[1].split('\n')){const li=line.match(/^\s+-\s+(.*)$/);
      if(li&&key){if(!Array.isArray(fm[key]))fm[key]=[];fm[key].push(parseVal(li[1]));continue}
      const kv=line.match(/^([A-Za-z0-9_]+):\s*(.*)$/);if(kv){key=kv[1];fm[key]=parseVal(kv[2])}}}
  return{fm,body}}
function setField(md,key,val){const out=typeof val==='number'?String(val):(val===''?'':(/^\d{4}-\d\d-\d\d$/.test(val)?val:JSON.stringify(val)));
  const m=md.match(/^---\n([\s\S]*?)\n---/);if(!m)return'---\n'+key+': '+out+'\n---\n'+md;
  const lines=m[1].split('\n'),res=[];let done=false,skip=false;
  for(const l of lines){if(skip&&/^\s+-\s/.test(l))continue;skip=false;
    if(l.startsWith(key+':')){res.push(key+': '+out);done=true;skip=true}else res.push(l)}
  if(!done)res.push(key+': '+out);return'---\n'+res.join('\n')+'\n---'+md.slice(m[0].length)}
function addLog(md,date,text){const line='- '+date+': '+text.replace(/\s*\n\s*/g,' ');
  if(/^## Log[ \t]*$/m.test(md))return md.replace(/^## Log[ \t]*\n?/m,'## Log\n'+line+'\n');return md.replace(/\s*$/,'')+'\n\n## Log\n'+line+'\n'}
function applyOps(md,ops){for(const o of ops||[]){if(o.t==='log')md=addLog(md,o.date,o.text);else if(o.t==='set')md=setField(md,o.k,o.v)}return md}
function view(p){if(p._v&&p._src===p.md&&p._n===(p.ops||[]).length)return p._v;const md=applyOps(p.md,p.ops);const{fm,body}=parseNote(md);
  p._v={md,fm,body};p._src=p.md;p._n=(p.ops||[]).length;return p._v}
const F=(p,k)=>{const v=view(p).fm[k];return v==null?'':v};
const arr=v=>Array.isArray(v)?v:(v?[v]:[]);
function lastTouch(p){return[F(p,'last_seen'),F(p,'last_contact')].map(String).filter(x=>/^\d{4}-/.test(x)).sort().pop()||''}
function color(n){let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))>>>0;return`hsl(${h%360} 38% 42%)`}
const initials=n=>n.replace(/\(.*?\)/g,'').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase();
const byName=n=>people.find(p=>p.name.toLowerCase()===String(n).toLowerCase());
function due(p){const m=parseFloat(F(p,'keep_in_touch_months'));if(!m)return null;const l=lastTouch(p);if(!l)return 9999;
  const days=(Date.now()-new Date(l).getTime())/864e5;return days-m*30.4}
function nextBirthday(p){const b=String(F(p,'birthday'));const m=b.match(/(\d\d)-(\d\d)$/);if(!m)return null;const n=new Date();
  let d=new Date(n.getFullYear(),+m[1]-1,+m[2]);if(d<new Date(n.getFullYear(),n.getMonth(),n.getDate()))d=new Date(n.getFullYear()+1,+m[1]-1,+m[2]);return d}

/* ---------- Google (Drive, Calendar, Tasks) ---------- */
const SCOPES='https://www.googleapis.com/auth/drive https://www.googleapis.com/auth/calendar.events https://www.googleapis.com/auth/tasks';
function loadGis(){return new Promise((ok,no)=>{if(window.google&&google.accounts)return ok();const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=ok;s.onerror=()=>no(new Error('Could not load Google sign-in'));document.head.appendChild(s)})}
async function getToken(interactive){if(token&&Date.now()<tokenExp-6e4)return token;if(!S.clientId)throw new Error('Add your Google client ID in Settings first');
  await loadGis();return new Promise((ok,no)=>{const c=google.accounts.oauth2.initTokenClient({client_id:S.clientId,scope:SCOPES,prompt:interactive?'':'none',
    callback:r=>{if(r.error)return no(new Error(r.error));token=r.access_token;tokenExp=Date.now()+r.expires_in*1e3;ok(token)},error_callback:e=>no(new Error(e.type||'sign-in failed'))});c.requestAccessToken()})}
async function api(url,opt={},interactive=false){const t=await getToken(interactive);const r=await fetch(url,{...opt,headers:{Authorization:'Bearer '+t,...(opt.headers||{})}});
  if(r.status===401){token=null;throw new Error('Google sign-in expired — tap Sync again')}if(!r.ok)throw new Error('Google error '+r.status+': '+(await r.text()).slice(0,140));return r}
const DR='https://www.googleapis.com/drive/v3/files';
async function folderId(){if(S.folderId)return S.folderId;const q=encodeURIComponent(`name='People' and '${VAULT_ID}' in parents and mimeType='application/vnd.google-apps.folder' and trashed=false`);
  const j=await(await api(`${DR}?q=${q}&fields=files(id,name)`)).json();if(!j.files.length)throw new Error('No "People" folder found in the vault yet');S.folderId=j.files[0].id;LS.set('people.settings',S);return S.folderId}
async function pushOne(p){if(!p.id||!(p.ops||[]).length)return;const fresh=await(await api(`${DR}/${p.id}?alt=media`)).text();const md=applyOps(fresh,p.ops);
  const j=await(await api(`https://www.googleapis.com/upload/drive/v3/files/${p.id}?uploadType=media&fields=modifiedTime`,{method:'PATCH',headers:{'Content-Type':'text/markdown'},body:md})).json();
  p.md=md;p.ops=[];p.mtime=j.modifiedTime}
async function createOne(p){const fid=await folderId();const meta={name:p.file,parents:[fid],mimeType:'text/markdown'};const b='x'+Date.now();
  const body=`--${b}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(meta)}\r\n--${b}\r\nContent-Type: text/markdown\r\n\r\n${applyOps(p.md,p.ops)}\r\n--${b}--`;
  const j=await(await api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,modifiedTime',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body})).json();
  p.id=j.id;p.md=applyOps(p.md,p.ops);p.ops=[];p.mtime=j.modifiedTime}
const INBOX='Voice inbox.md';
async function pushInbox(){if(!inbox.length)return;const send=inbox.slice();
  const lines=send.map(n=>`- [ ] ${n.t} — ${n.text.replace(/\s*\n\s*/g,' ')}`).join('\n')+'\n';
  const q=encodeURIComponent(`name='${INBOX}' and '${VAULT_ID}' in parents and trashed=false`);const f=(await(await api(`${DR}?q=${q}&fields=files(id)`)).json()).files[0];
  if(f){const cur=await(await api(`${DR}/${f.id}?alt=media`)).text();await api(`https://www.googleapis.com/upload/drive/v3/files/${f.id}?uploadType=media`,{method:'PATCH',headers:{'Content-Type':'text/markdown'},body:cur.replace(/\n*$/,'\n')+lines})}
  else{const b='x'+Date.now();const meta={name:INBOX,parents:[VAULT_ID],mimeType:'text/markdown'};
    const head='# Voice inbox\n\nVoice notes from the People app. Ask Claude to "process my voice inbox" and it will update the right people and tick these off.\n\n';
    await api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body:`--${b}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(meta)}\r\n--${b}\r\nContent-Type: text/markdown\r\n\r\n${head+lines}\r\n--${b}--`})}
  inbox=inbox.slice(send.length);saveInbox()}
async function sync(interactive){if(syncing)return;syncing=true;render();try{await getToken(interactive);const fid=await folderId();
    for(const p of people){if(p.id&&(p.ops||[]).length)await pushOne(p);else if(!p.id&&p.local)await createOne(p)}
    await pushInbox();
    let files=[],pt='';do{const j=await(await api(`${DR}?q=${encodeURIComponent(`'${fid}' in parents and trashed=false`)}&fields=nextPageToken,files(id,name,modifiedTime)&pageSize=1000${pt?'&pageToken='+pt:''}`)).json();files=files.concat(j.files);pt=j.nextPageToken||''}while(pt);
    files=files.filter(f=>/\.md$/i.test(f.name));const have=new Map(people.filter(p=>p.id).map(p=>[p.id,p]));const need=files.filter(f=>!have.get(f.id)||have.get(f.id).mtime!==f.modifiedTime);
    let i=0;const work=async()=>{while(i<need.length){const f=need[i++];const md=await(await api(`${DR}/${f.id}?alt=media`)).text();let p=have.get(f.id);
        if(!p){p={id:f.id,ops:[]};people.push(p);have.set(f.id,p)}p.file=f.name;p.name=f.name.normalize('NFC').replace(/\.md$/i,'');p.md=md;p.mtime=f.modifiedTime;p._v=null}};
    await Promise.all(Array.from({length:6},work));const ids=new Set(files.map(f=>f.id));people=people.filter(p=>!p.id||ids.has(p.id));
    people.sort((a,b)=>a.name.localeCompare(b.name));save();lastSync=new Date().toLocaleString();LS.set('people.lastSync',lastSync);toast(`Synced ${files.length} people`)}
  catch(e){toast(e.message)}finally{syncing=false;render()}}
async function change(p,op){p.ops=(p.ops||[]).concat(op);p._v=null;save();render();if(p.id&&token&&navigator.onLine){try{await pushOne(p);save();render()}catch(e){toast('Saved on this phone; will sync later')}}}
async function remind(text,date){if(token||S.clientId){try{await getToken(!token);
      await api('https://www.googleapis.com/calendar/v3/calendars/primary/events',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({summary:text,start:{date},end:{date:new Date(new Date(date).getTime()+864e5).toISOString().slice(0,10)},reminders:{useDefault:true}})});
      await api('https://tasks.googleapis.com/tasks/v1/lists/@default/tasks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:text,due:date+'T00:00:00.000Z'})});
      toast('Reminder added to Calendar and Tasks');return}catch(e){toast(e.message+' — opening Calendar instead')}}
  const d=date.replace(/-/g,''),e=new Date(new Date(date).getTime()+864e5).toISOString().slice(0,10).replace(/-/g,'');
  window.open(`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(text)}&dates=${d}/${e}`,'_blank')}

/* ---------- import (no Google needed) ---------- */
async function importFiles(list){let n=0;for(const f of list){if(!/\.md$/i.test(f.name))continue;const md=await f.text();const name=f.name.normalize('NFC').replace(/\.md$/i,'');
    let p=people.find(x=>x.file===f.name);if(!p){p={id:null,ops:[]};people.push(p)}p.file=f.name;p.name=name;p.md=md;p._v=null;n++}
  people.sort((a,b)=>a.name.localeCompare(b.name));save();toast(`Imported ${n} notes`);render()}

/* ---------- views ---------- */
const $=s=>document.querySelector(s);let ui={q:'',circle:'',city:''};
function avatar(p,big){return`<div class="av${big?' big':''}" style="background:${color(p.name)}">${esc(initials(p.name))}</div>`}
function item(p,sub){return`<a class="item" href="#p/${encodeURIComponent(p.name)}">${avatar(p)}<div class="grow"><div>${esc(p.name)}</div><div class="sub">${esc(sub??[F(p,'circle'),F(p,'city')||String(F(p,'city_guess')).replace(/\s*\(.*\)$/,'')].filter(Boolean).join(' · '))}</div></div></a>`}
function list(ps,sub,empty){return ps.length?`<div class="card">${ps.map(p=>item(p,sub&&sub(p))).join('')}</div>`:`<p class="mute">${empty||'Nobody here yet.'}</p>`}
function search(q){q=q.toLowerCase().trim();const rank=p=>{const n=p.name.toLowerCase();if(n.startsWith(q))return 0;if(n.includes(q))return 1;const v=view(p);if(JSON.stringify(v.fm).toLowerCase().includes(q))return 2;if(v.body.toLowerCase().includes(q))return 3;return 9};
  return people.map(p=>[rank(p),p]).filter(x=>x[0]<9).sort((a,b)=>a[0]-b[0]||a[1].name.localeCompare(b[1].name)).map(x=>x[1])}
function vHome(){const pend=people.reduce((a,p)=>a+(p.ops||[]).length,0);
  let h=`<h1>People</h1><input class="field" id="q" type="search" placeholder="Search ${people.length} people, places, notes" value="${esc(ui.q)}">`;
  if(!people.length)return h+`<h2>Get started</h2><div class="card" style="padding:14px"><p>No people loaded yet. Connect Google Drive in Settings to read your Obsidian vault, or import the notes folder.</p><a class="btn" href="#settings" style="text-decoration:none;display:inline-block">Open Settings</a></div>`;
  if(ui.q)return h+`<h2>Results</h2>`+list(search(ui.q).slice(0,60),null,'No matches.');
  const dues=people.map(p=>[due(p),p]).filter(x=>x[0]!=null&&x[0]>0).sort((a,b)=>b[0]-a[0]).slice(0,12);
  const soon=people.map(p=>[nextBirthday(p),p]).filter(x=>x[0]&&(x[0]-Date.now())<45*864e5).sort((a,b)=>a[0]-b[0]);
  const recent=people.filter(p=>F(p,'last_seen')).sort((a,b)=>String(F(b,'last_seen')).localeCompare(String(F(a,'last_seen')))).slice(0,6);
  h+=`<p class="status"><span class="dot ${pend?'pend':(lastSync?'ok':'')}"></span>${pend?pend+' change'+(pend>1?'s':'')+' waiting to sync':(lastSync?'Synced '+esc(lastSync):'Not synced with Drive yet')}</p>`;

  const W=svg.viewBox.baseVal.width,H=svg.viewBox.baseVal.height,P=webGraph().pos;const pts=new Map();let moved=0,start=null,pinch=null,multi=false;
  const loc=e=>{const b=svg.getBoundingClientRect(),s=W/b.width;return{x:(e.clientX-b.left)*s,y:(e.clientY-b.top)*s}};
  const clamp=()=>{t.x=Math.min(W/2,Math.max(W/2-W*t.k,t.x));t.y=Math.min(H/2,Math.max(H/2-H*t.k,t.y))};   // never lose the map off-screen
  const apply=()=>{clamp();g.setAttribute('transform',`translate(${t.x} ${t.y}) scale(${t.k})`);const r=$('#wreset');if(r)r.hidden=t.k===1&&!t.x&&!t.y};
  const zoom=(c,k)=>{k=Math.min(8,Math.max(1,k));t.x=c.x-(c.x-t.x)*k/t.k;t.y=c.y-(c.y-t.y)*k/t.k;t.k=k;apply()};
  const restart=()=>{const p=[...pts.values()][0];start=p?{x:p.x,y:p.y,tx:t.x,ty:t.y}:null};
  const nearest=p=>{const gx=(p.x-t.x)/t.k,gy=(p.y-t.y)/t.k;let best=null,bd=Infinity;
    for(const n of webGraph().nodes){const q=P[n.id];if(!q)continue;const d=Math.hypot(q.x-gx,q.y-gy);if(d<bd){bd=d;best=n.id}}
    return bd*t.k<=22?best:null};   // generous finger-sized hit area
  svg.addEventListener('pointerdown',e=>{e.preventDefault();pts.set(e.pointerId,loc(e));try{svg.setPointerCapture(e.pointerId)}catch(x){}
    if(pts.size===1){moved=0;multi=false;restart()}else{multi=true;const[p1,p2]=[...pts.values()];pinch={d:Math.hypot(p1.x-p2.x,p1.y-p2.y)||1,k:t.k}}});
  svg.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,loc(e));
    if(pts.size>=2&&pinch){const[p1,p2]=[...pts.values()];zoom({x:(p1.x+p2.x)/2,y:(p1.y+p2.y)/2},pinch.k*Math.hypot(p1.x-p2.x,p1.y-p2.y)/pinch.d);return}
    if(!start)return;const p=loc(e);moved=Math.max(moved,Math.hypot(p.x-start.x,p.y-start.y));if(moved>6){t.x=start.tx+p.x-start.x;t.y=start.ty+p.y-start.y;apply()}});
  const end=e=>{if(!pts.has(e.pointerId))return;const p=pts.get(e.pointerId);pts.delete(e.pointerId);
    if(pts.size<2)pinch=null;if(pts.size===1){restart();moved=99;return}   // lifted one finger of a pinch: keep panning smoothly
    if(!pts.size&&e.type==='pointerup'&&!multi&&moved<=6){const n=nearest(p);if(n)location.hash='#web/'+encodeURIComponent(n)}};
  svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end);
  svg.addEventListener('wheel',e=>{e.preventDefault();zoom(loc(e),t.k*(e.deltaY<0?1.15:1/1.15))},{passive:false});apply()}
document.addEventListener('click',e=>{const n=e.target.closest&&e.target.closest('#egosvg [data-n]');if(n)location.hash='#web/'+encodeURIComponent(n.dataset.n);
  const p=e.target.closest&&e.target.closest('#egosvg [data-p]');if(p)location.hash='#p/'+encodeURIComponent(p.dataset.p)});

/* ---------- quick search / quick update (bottom buttons) ---------- */
function openSheet(kind){const[r,arg]=route();ui.sheet=kind;ui.sq='';ui.ap='';ui.atext=ui.atext||'';ui.apick=kind==='add'&&(r==='person'||r==='web')&&arg&&byName(arg)?byName(arg).name:'';renderSheet();
  setTimeout(()=>{const e=$(kind==='search'?'#sq':(ui.apick?'#atext':'#ap'));if(e)e.focus()},50)}
function closeSheet(){if(rec)rec.stop();ui.sheet=null;renderSheet()}
function renderSheet(keepFocus){const s=$('#sheet');if(!ui.sheet){s.hidden=true;s.innerHTML='';document.body.style.overflow='';return}
  const act=document.activeElement,id=act&&act.id,pos=act&&act.selectionStart;s.hidden=false;document.body.style.overflow='hidden';
  const head=t=>`<div class="row" style="margin-bottom:10px"><h1 class="grow" style="margin:0">${t}</h1><button class="x" id="sclose" aria-label="Close">✕</button></div>`;
  if(ui.sheet==='search'){const q=ui.sq.trim();const res=q?search(q).slice(0,60):[];
    s.innerHTML=`<div class="in">${head('Search')}<input class="field" id="sq" type="search" placeholder="Name, place, company, anything in their notes" value="${esc(ui.sq)}" autocomplete="off">
    <div style="margin-top:12px">${q?(res.length?`<div class="card">${res.map(p=>item(p)).join('')}</div>`:'<p class="mute">No matches.</p>'):`<p class="mute">Searches all ${people.length} people: names, cities, companies, and everything in their notes.</p>`}</div></div>`}
  else{const p=ui.apick&&byName(ui.apick);const q=ui.ap.trim().toLowerCase();
    const opts=q?people.filter(x=>x.name.toLowerCase().includes(q)).slice(0,8):[];
    s.innerHTML=`<div class="in">${head('Add an update')}
    ${p?`<div class="card"><div class="item" style="cursor:default">${avatar(p)}<div class="grow"><div style="font-weight:700">${esc(p.name)}</div><div class="sub">${esc([F(p,'circle'),lastTouch(p)?'last contact '+lastTouch(p):''].filter(Boolean).join(' · '))}</div></div><button class="btn small ghost" id="achange">Change</button></div></div>`
      :`<input class="field" id="ap" type="search" placeholder="Who is this about?" value="${esc(ui.ap)}" autocomplete="off">${opts.length?`<div class="card" style="margin-top:8px">${opts.map(x=>`<button class="pick" data-pick="${esc(x.name)}">${avatar(x)}<div class="grow"><div>${esc(x.name)}</div><div class="sub mute small">${esc(F(x,'circle')||'')}</div></div></button>`).join('')}</div>`:(q?'<p class="mute small">Nobody by that name. Add them from the Everyone tab first.</p>':'')}`}
    <div class="card" style="padding:12px;margin-top:12px"><textarea class="field" id="atext" placeholder="What happened? e.g. Grabbed beers, he just started a new job…">${esc(ui.atext)}</textarea>
    <div class="row wrap" style="margin-top:8px"><button class="btn small ghost mic" id="amic">Speak</button><label class="small row"><input type="checkbox" id="aseen" checked> saw them today</label><span class="grow"></span><button class="btn small" id="asave">Save</button></div></div></div>`}
  if(keepFocus&&id&&$('#'+id)){const e=$('#'+id);e.focus();try{e.setSelectionRange(pos,pos)}catch(x){}}}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.sheet)closeSheet()});

/* ---------- router + events ---------- */
function route(){const h=decodeURIComponent(location.hash.slice(1));if(h.startsWith('p/'))return['person',h.slice(2)];if(h.startsWith('web/'))return['web',h.slice(4)];return[h||'home','']}
function render(keepFocus){const[r,arg]=route();const v=$('#view');const act=document.activeElement,id=act&&act.id,pos=act&&act.selectionStart;
  v.innerHTML=r==='person'?vPerson(arg):r==='web'?vWeb(arg):r==='people'?vPeople():r==='city'?vCity():r==='settings'?vSettings():vHome();
  $('#nav').innerHTML=[['home','⌂','Home'],['people','☰','Everyone'],['web','✳︎','Web'],['city','◎','City'],['settings','⚙','Settings']].map(t=>`<a href="#${t[0]}" class="${r===t[0]?'on':''}"><span>${t[1]}</span>${t[2]}</a>`).join('');
  if(r==='web')webWire();
  if(keepFocus&&id&&$('#'+id)){const e=$('#'+id);e.focus();try{e.setSelectionRange(pos,pos)}catch(x){}}}
addEventListener('hashchange',()=>{if(ui.sheet)closeSheet();render();scrollTo(0,0)});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='sq'){ui.sq=t.value;return renderSheet(true)}if(t.id==='ap'){ui.ap=t.value;return renderSheet(true)}if(t.id==='atext'){ui.atext=t.value;return}if(t.id==='vtext'){ui.vtext=t.value;return}if(t.id==='q'){ui.q=t.value;render(true)}if(t.id==='city'){ui.city=t.value;render(true)}});
document.addEventListener('change',e=>{const t=e.target;const[r,arg]=route();
  if(t.dataset.k&&r==='person'){const p=byName(arg);let v=t.value.trim();if(t.dataset.k==='keep_in_touch_months'&&v)v=+v;if(String(F(p,t.dataset.k))!==String(v))change(p,{t:'set',k:t.dataset.k,v})}
  if(t.id==='wq'){const p=byName(t.value.trim());if(p)location.hash='#web/'+encodeURIComponent(p.name)}
  if(t.id==='cid'){S.clientId=t.value.trim();LS.set('people.settings',S)}if(t.id==='imp')importFiles(t.files)});
let rec=null;
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const[r,arg]=route();const p=r==='person'?byName(arg):null;
  if(t.id==='shuffle'){ui.rand=null;render();return}
  if(t.id==='vsave'){const text=($('#vtext').value||'').trim();if(!text)return toast('Say or type a note first');if(rec)rec.stop();
    const d=new Date();inbox.push({t:today()+' '+d.toTimeString().slice(0,5),text});saveInbox();ui.vtext='';render();
    if(token&&navigator.onLine)pushInbox().then(()=>{toast('Voice note saved to your vault');render()}).catch(()=>toast('Saved on this phone; will upload on next sync'));else toast('Saved on this phone; will upload on next sync');return}
  if(t.id==='qsearch')return openSheet('search');if(t.id==='qadd')return openSheet('add');if(t.id==='sclose')return closeSheet();
  if(t.dataset.pick!=null){ui.apick=t.dataset.pick;ui.ap='';renderSheet();setTimeout(()=>$('#atext')&&$('#atext').focus(),30);return}
  if(t.id==='achange'){ui.apick='';renderSheet();setTimeout(()=>$('#ap')&&$('#ap').focus(),30);return}
  if(t.id==='asave'){const who=byName(ui.apick);const text=($('#atext').value||'').trim();if(!who)return toast('Pick who this is about');if(!text)return toast('Write or speak an update first');
    const ops=[{t:'log',date:today(),text}];if($('#aseen').checked)ops.push({t:'set',k:'last_seen',v:today()});ui.atext='';closeSheet();change(who,ops);toast('Logged for '+who.name);return}
  if(t.dataset.circle!=null){ui.circle=t.dataset.circle;render()}
  if(t.dataset.wc!=null){ui.wc=t.dataset.wc;render()}
  if(t.id==='wreset'){ui.wt={x:0,y:0,k:1};render()}
  if(t.dataset.city!=null){ui.city=t.dataset.city;render()}
  if(t.id==='sync'){S.clientId=$('#cid').value.trim();LS.set('people.settings',S);sync(true)}
  if(t.id==='clear'&&confirm('Remove the offline copy from this phone? Your Drive notes are not touched.')){people=[];save();render()}
  if(t.id==='savelog'){const text=$('#log').value.trim();if(!text)return toast('Write or speak an update first');const ops=[{t:'log',date:today(),text}];if($('#seen').checked)ops.push({t:'set',k:'last_seen',v:today()});change(p,ops);toast('Logged')}
  if(t.id==='ask'){const text=`Update my People notes in Obsidian. Person: ${p.name}. ${$('#log').value.trim()}`;if(navigator.share)navigator.share({text}).catch(()=>{});else{navigator.clipboard?.writeText(text);toast('Copied — paste it to Claude')}}
  if(t.id==='rsave'){const text=$('#rtext').value.trim()||('Reach out to '+p.name);remind(text,$('#rdate').value||today());change(p,{t:'log',date:today(),text:`Reminder set for ${$('#rdate').value}: ${text}`})}
  if(t.id==='mic'||t.id==='amic'||t.id==='vmic'){const bid=t.id;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return toast('Voice typing is not available in this browser — use the keyboard mic');
    if(rec){rec.stop();return}rec=new SR();rec.continuous=true;rec.interimResults=false;rec.lang=navigator.language||'en-US';const box=$(bid==='mic'?'#log':bid==='vmic'?'#vtext':'#atext');t.classList.add('on');t.textContent='Stop';
    rec.onresult=ev=>{for(let i=ev.resultIndex;i<ev.results.length;i++)if(ev.results[i].isFinal){box.value=(box.value+' '+ev.results[i][0].transcript).trim();if(bid==='amic')ui.atext=box.value;if(bid==='vmic')ui.vtext=box.value}};
    rec.onend=rec.onerror=()=>{rec=null;const b=$('#'+bid);if(b){b.classList.remove('on');b.textContent='Speak'}};rec.start()}
  if(t.id==='newp'){const name=(prompt('Name')||'').trim();if(!name)return;if(byName(name))return location.hash='#p/'+encodeURIComponent(name);
    const md=`---\ntype: person\ncircle: ""\ntags: [person]\ncity: ""\ncity_guess: ""\ncompany: ""\ntitle: ""\ninterests: ""\npartner: ""\nbirthday: \nphone: []\nemail: []\nlast_seen: \nlast_contact: \nkeep_in_touch_months: \ntier: \n---\n\n# ${name}\n\n## Context\n- \n\n## Log\n`;
    people.push({id:null,local:true,file:name.replace(/[\\/:*?"<>|#^\[\]]/g,'')+'.md',name,md,ops:[]});people.sort((a,b)=>a.name.localeCompare(b.name));save();location.hash='#p/'+encodeURIComponent(name);if(token)sync(false)}});
addEventListener('online',()=>{if(token)sync(false)});
if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script>
